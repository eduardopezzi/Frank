# ─── Cycles Rendering Engine — Docker Compose ────────────────────
# Usage:
#   docker-compose up -d            # Start all services
#   docker-compose up -d --scale worker=3  # Start with 3 workers
#   docker-compose logs -f worker   # Follow worker logs
#   docker-compose down             # Stop all services

services:
  # ─── Redis (Message Broker + Result Backend) ──────────────────
  redis:
    image: redis:7-alpine
    container_name: cycles-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ─── API (FastAPI) ────────────────────────────────────────────
  api:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: cycles-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/outputs
      - RENDER_SAMPLES=64
      - RENDER_RESOLUTION_X=1920
      - RENDER_RESOLUTION_Y=1080
      - RENDER_DEVICE=CPU
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
      - ./catalog:/app/catalog
      - ./cycles.db:/app/cycles.db
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Worker (Celery + Blender) ────────────────────────────────
  worker:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: cycles-worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - BLENDER_PATH=/usr/local/blender/blender
      - BLENDER_TIMEOUT=600
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/outputs
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
      - ./catalog:/app/catalog
    depends_on:
      redis:
        condition: service_healthy
    # Uncomment below for GPU support (requires NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped

volumes:
  redis_data:
  uploads:
  outputs:
